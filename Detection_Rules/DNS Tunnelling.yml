title: DNS Tunelling activity Detected
status: experimental
description: Detects DNS tunnelling by identifying
  unusually long DNS queries and high volume of DNS requests
  from a single source. Attackers use DNS tunnelling to
  exfiltrate data or establish C2 communication by encoding
  data inside DNS queries.
logsource:
  category: network
  product: suricata
detection:
  selection:
    event.type: dns 
    dns.type: query 
  filter:
    dns.rrname|endswith:
    - '.com'
    - '.org'
    - '.net'
    - '.in' 
  condition: selection and not filter | count(dns.rrname) by src_ip > 50
falsepositives:
    - Legitimate high-volume DNS resolvers
level: high
tags:
  - attack.exfiltration
  - attack.command_and_control
  - attack.t1048
  - attack.t1071