title: Multiple Failed Logon Attempts Followed by Success Possible Brute Force

description: Detects multiple failed logon attempts (Event ID 4625) for a single account within a short time window, followed by a successful logon (Event ID 4624) indicative of a brute force attack against a domain account.

author: Uday Sharma
date: 2026/06/20
tags:
    - attack.t1110.001
    - attack.credential_access
logsource:
    product: windows
    service: security
detection:
    selection_failed:
        EventID: 4625
        LogonType: 3
    selection_success:
        EventID: 4624
        LogonType: 3
    timeframe: 5m
    condition: selection_failed | count(TargetUserName) by TargetUserName >= 5 and selection_success
falsepositives:
    - Legitimate user repeatedly mistyping their password before eventually succeeding
    - Password manager misconfiguration causing repeated retries
level: high