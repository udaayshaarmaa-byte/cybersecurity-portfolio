title: SSH Brute Force Attempt Detected
status: experimental
description: >
  Detects multiple failed SSH authentication attempts from a single
  source IP within a short timeframe, indicating a brute force attack.
author: Uday Sharma
date: 2026/05/23
logsource:
    product: linux
    service: auth
detection:
    selection:
        type: 'sshd'
        message|contains: 'Failed password'
    timeframe: 5m
    condition: selection | count(src_ip) by src_ip > 5
falsepositives:
    - Misconfigured legitimate connection
level: high
tags:
    - attack.credential_access
    - attack.t1110